<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAAS Edge | Pairing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@500;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #09090c 0%, #1a1a24 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
            z-index: 0;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #ff3366;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #00d2ff;
            bottom: -50px;
            right: -50px;
            animation-delay: -3s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(50px) scale(1.1); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 50px 60px;
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: #00d2ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
            animation: pulse-anim 2s infinite;
        }

        @keyframes pulse-anim {
            0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 210, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(to right, #fff, #a3a3b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #8b8b9c;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .code-container {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .code-container:hover {
            border-color: rgba(255, 51, 102, 0.4);
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.15);
            transform: scale(1.02);
        }

        .pair-code {
            font-family: 'Outfit', monospace;
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 12px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            margin-right: -12px; /* compensate for letter spacing */
        }

        .copy-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ff3366;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .code-container.copied .pair-code {
            opacity: 0.1;
        }
        .code-container.copied .copy-hint {
            opacity: 1;
        }

        .footer {
            font-size: 0.85rem;
            color: #555566;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer svg {
            width: 16px;
            height: 16px;
            fill: #555566;
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-card">
        <div class="status-badge">
            <div class="pulse"></div>
            Awaiting Command Center Claim
        </div>
        
        <h1>Edge Node Ready</h1>
        <p>This physical edge device is securely broadcasting its beacon. Enter the 6-digit code below into your MAAS Command Center to establish a Zero-Trust connection.</p>
        
        <div class="code-container" onclick="copyCode()">
            <div class="pair-code" id="codeText">{{PAIR_CODE}}</div>
            <div class="copy-hint">Copied to clipboard!</div>
        </div>

        <div class="footer">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Zero-Trust Ephemeral Handshake Protocol
        </div>
    </div>

    <script>
        function copyCode() {
            const code = document.getElementById('codeText').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const container = document.querySelector('.code-container');
                container.classList.add('copied');
                setTimeout(() => {
                    container.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
